name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --workspace packages/core

      - name: Build all packages
        run: npm run build

      - name: Package CLI
        run: |
          cd packages/cli
          npm pack
          mv *.tgz ../../cpscheme-cli-$(node -p "require('./package.json').version").tgz
          cd ../..

      - name: Package core library
        run: |
          cd packages/core
          npm pack
          mv *.tgz ../../cpscheme-core-$(node -p "require('./package.json').version").tgz
          cd ../..

      - name: Build web archive
        run: |
          cd packages/web
          npm run build
          cd dist
          zip -r ../../cpscheme-web-$(node -p "require('../package.json').version").zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cpscheme-cli-*.tgz
            cpscheme-core-*.tgz
            cpscheme-web-*.zip
